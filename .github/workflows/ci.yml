name: CI

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      # Keep the existing Node version for compatibility with node-sass 7.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Build frontend
        run: yarn build:frontend

      - name: Build Docker image
        run: docker build --no-cache -t gradinware-server .
